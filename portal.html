<!DOCTYPE html>
<html lang="en">
<head><link rel="stylesheet" href="style.css">

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Client & Partner Portal | Kikoma Global Investment Limited</title>
  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    :root {
      --bg-primary: #050f0b;
      --bg-secondary: #0a1f16;
      --bg-card: #0e291e;
      --border-color: #1c3f30;
      --gold: #d4af37;
      --gold-hover: #f1c40f;
      --text-main: #f0f4f1;
      --text-muted: #9fb3a6;
      --transition: all 0.35s cubic-bezier(0.4, 0, 0.2, 1);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background-color: var(--bg-primary);
      color: var(--text-main);
      width: 100%;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
      line-height: 1.6;
    }

    /* Ambient Background Glow */
    .ambient-glow {
      position: fixed;
      top: -200px;
      right: -200px;
      width: 600px;
      height: 600px;
      background: radial-gradient(circle, rgba(212, 175, 55, 0.05) 0%, rgba(5, 15, 11, 0) 70%);
      z-index: -1;
      pointer-events: none;
    }

    /* Header */
    header {
      width: 100%;
      max-width: 1280px;
      margin: 0 auto;
      padding: 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--border-color);
      background-color: var(--bg-primary);
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .brand-container {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .brand-logo {
      width: 38px;
      height: 38px;
      background: linear-gradient(135deg, var(--gold), #aa820a);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--bg-primary);
      font-weight: 700;
      font-size: 1.2rem;
      box-shadow: 0 4px 12px rgba(212, 175, 55, 0.2);
    }

    .brand-title {
      color: var(--gold);
      font-size: 1.1rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      font-family: 'Playfair Display', serif;
    }

    .back-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 8px 16px;
      background-color: transparent;
      border: 1.5px solid var(--gold);
      color: var(--gold);
      text-decoration: none;
      border-radius: 8px;
      font-weight: 600;
      font-size: 0.85rem;
      transition: var(--transition);
    }

    .back-btn:hover {
      background-color: var(--gold);
      color: var(--bg-primary);
    }

    /* Main Container */
    .container {
      max-width: 500px;
      width: 100%;
      margin: auto;
      padding: 40px 20px;
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    /* Login Card */
    .portal-card {
      background-color: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 16px;
      padding: 40px 30px;
      box-shadow: 0 20px 50px rgba(0,0,0,0.6);
      text-align: center;
    }

    .portal-icon {
      width: 65px;
      height: 65px;
      background: rgba(212, 175, 55, 0.1);
      border: 1px solid rgba(212, 175, 55, 0.3);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--gold);
      font-size: 1.5rem;
      margin: 0 auto 20px;
    }

    .portal-card h1 {
      color: #ffffff;
      font-family: 'Playfair Display', serif;
      font-size: 1.8rem;
      margin-bottom: 8px;
    }

    .portal-card p {
      color: var(--text-muted);
      font-size: 0.9rem;
      margin-bottom: 30px;
    }

    .form-group {
      text-align: left;
      margin-bottom: 20px;
    }

    .form-group label {
      display: block;
      color: var(--text-main);
      font-size: 0.78rem;
      font-weight: 600;
      margin-bottom: 6px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .form-control {
      width: 100%;
      padding: 14px 16px;
      background-color: var(--bg-secondary);
      border: 1px solid var(--border-color);
      border-radius: 10px;
      color: #ffffff;
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-size: 1rem;
      transition: var(--transition);
    }

    .form-control:focus {
      outline: none;
      border-color: var(--gold);
      box-shadow: 0 0 10px rgba(212, 175, 55, 0.2);
    }

    .login-btn {
      width: 100%;
      padding: 15px;
      background-color: var(--gold);
      color: var(--bg-primary);
      border: none;
      border-radius: 10px;
      font-weight: 700;
      font-size: 1rem;
      cursor: pointer;
      transition: var(--transition);
      box-shadow: 0 4px 15px rgba(212, 175, 55, 0.3);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-top: 10px;
    }

    .login-btn:hover {
      background-color: var(--gold-hover);
      transform: translateY(-2px);
    }

    .portal-help {
      margin-top: 25px;
      font-size: 0.85rem;
      color: var(--text-muted);
    }

    .portal-help a {
      color: var(--gold);
      text-decoration: none;
      font-weight: 600;
    }

    /* Footer */
    footer {
      text-align: center;
      padding: 25px 20px;
      border-top: 1px solid var(--border-color);
      color: var(--text-muted);
      font-size: 0.85rem;
      background-color: var(--bg-secondary);
      margin-top: auto;
    }
  </style>
</head>
<body>

  <div class="ambient-glow"></div>

  <header>
    <div class="brand-container">
      <div class="brand-logo">KG</div>
      <div class="brand-title">Kikoma Global</div>
    </div>
    <a href="index.html" class="back-btn"><i class="fa-solid fa-arrow-left"></i> Home</a>
  </header>

  <div class="container">
    
    <div class="portal-card">
      <div class="portal-icon"><i class="fa-solid fa-lock"></i></div>
      <h1>Client & Partner Login</h1>
      <p>Access your secure dashboard for trade contracts, weighing reports, and documentation.</p>

      <form onsubmit="event.preventDefault(); alert('Secure authentication gateway active. Please contact exportlead@kikomaglobal.com for enterprise credentials.');">
        <div class="form-group">
          <label for="username">Partner Email / ID</label>
          <input type="text" id="username" class="form-control" placeholder="Enter partner email" required>
        </div>

        <div class="form-group">
          <label for="password">Secure Password</label>
          <input type="password" id="password" class="form-control" placeholder="••••••••••••" required>
        </div>

        <button type="submit" class="login-btn">
          <i class="fa-solid fa-right-to-bracket"></i> Sign In to Portal
        </button>
      </form>

      <div class="portal-help">
        Need access credentials? <a href="contact.html">Contact Trade Desk</a>
      </div>
    </div>

  </div>

  <footer>
    &copy; 2026 Kikoma Global Investment Limited. All rights reserved. Secure Idiroko Portal.
  </footer>

</body>
</html>
