<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kikoma Global Investment Limited</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f4f4f9;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }
    .auth-box {
      background: #ffffff;
      padding: 30px;
      border-radius: 8px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
      width: 300px;
      text-align: center;
    }
    .auth-box h3 {
      margin-bottom: 20px;
      color: #333;
    }
    .auth-box input {
      width: 100%;
      padding: 10px;
      margin-bottom: 12px;
      border: 1px solid #ccc;
      border-radius: 4px;
      box-sizing: border-box;
    }
    .auth-box button {
      width: 100%;
      padding: 10px;
      margin-top: 5px;
      border: none;
      border-radius: 4px;
      background-color: #004080;
      color: white;
      font-weight: bold;
      cursor: pointer;
    }
    .auth-box button:hover {
      background-color: #003060;
    }
    #status-message {
      margin-top: 15px;
      font-size: 14px;
      color: #555;
    }
  </style>
</head>
<body>

  <div class="auth-box">
    <h3>Account Access</h3>
    <input type="email" id="user-email" placeholder="Email address" required />
    <input type="password" id="user-password" placeholder="Password" required />
    <button id="sign-up-btn">Sign Up</button>
    <button id="sign-in-btn">Sign In</button>
    <p id="status-message"></p>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const supabaseUrl = 'https://kikomaglobal.supabase.co';
       const supabaseUrl = 'https://kikomaglobal.supabase.co';
    const _supabase = supabase.createClient(supabaseUrl, supabaseKey);

    document.getElementById('sign-up-btn').addEventListener('click', async () => {
      const email = document.getElementById('user-email').value;
      const password = document.getElementById('user-password').value;
      
      const { data, error } = await _supabase.auth.signUp({ email, password });
      document.getElementById('status-message').innerText = error ? error.message : 'Registration successful! Check your email to confirm.';
    });

    document.getElementById('sign-in-btn').addEventListener('click', async () => {
      const email = document.getElementById('user-email').value;
      const password = document.getElementById('user-password').value;
      
      const { data, error } = await _supabase.auth.signInWithPassword({ email, password });
      if (error) {
        document.getElementById('status-message').innerText = error.message;
      } else {
        document.getElementById('status-message').innerText = 'Welcome back! Signed in successfully.';
      }
    });
  </script>
</body>
</html>
